name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pipx install ruff

      - name: Lint
        run: ruff check claude-usage.5m.py tests/test_plugin.py

      - name: Compile check
        run: python -m py_compile claude-usage.5m.py

      - name: Tests
        run: python tests/test_plugin.py

      - name: Shell scripts parse
        run: bash -n install.sh && bash -n uninstall.sh
